name: 🎵 Build YVL Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK (No secrets needed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build FOSS Debug APK
        run: ./gradlew assembleFossDebug --no-daemon --stacktrace

      - name: List generated APKs
        run: find app/build/outputs/apk -name "*.apk" | while read f; do echo "Found: $f ($(du -h $f | cut -f1))"; done

      - name: Rename APK to YVL-Music-debug.apk
        run: |
          mkdir -p app/build/outputs/apk/final
          find app/build/outputs/apk -name "*.apk" ! -path "*/final/*" | head -1 | xargs -I{} cp {} app/build/outputs/apk/final/YVL-Music-debug.apk
          echo "APK ready: YVL-Music-debug.apk"

      - name: Upload APK — Download here ⬇️
        uses: actions/upload-artifact@v4
        with:
          name: YVL-Music-debug-APK
          path: app/build/outputs/apk/final/YVL-Music-debug.apk
          retention-days: 90
