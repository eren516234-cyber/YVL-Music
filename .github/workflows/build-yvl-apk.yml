name: Build YVL Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-debug-apk:
    name: Build Debug APK (No secrets needed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: |
          chmod +x gradlew

      - name: Build Universal FOSS Debug APK
        run: |
          ./gradlew :app:assembleUniversalFossDebug --no-daemon --stacktrace

      - name: List generated APKs
        run: |
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Rename APK to YVL-Music-debug.apk
        run: |
          mkdir -p app/build/outputs/apk/final
          find app/build/outputs/apk -name "*.apk" ! -path "*/final/*" | head -1 | xargs -I{} cp {} app/build/outputs/apk/final/YVL-Music-debug.apk
          echo "APK ready at app/build/outputs/apk/final/YVL-Music-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YVL-Music-debug-APK
          path: app/build/outputs/apk/final/YVL-Music-debug.apk
          retention-days: 90
