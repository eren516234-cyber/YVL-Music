name: Build YVL Music APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app (Vite)
        run: pnpm --filter @workspace/mockup-sandbox run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production

      - name: Install Capacitor (standalone, not via workspace)
        run: |
          cd artifacts/mockup-sandbox
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Initialize Capacitor
        run: |
          cd artifacts/mockup-sandbox
          npx @capacitor/cli init "YVL Music" "com.wshourya.yvlmusic" --web-dir dist 2>/dev/null || true

      - name: Add Android platform
        run: |
          cd artifacts/mockup-sandbox
          npx cap add android 2>/dev/null || true

      - name: Sync web build to Android
        run: |
          cd artifacts/mockup-sandbox
          npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Gradle execute permission
        run: chmod +x artifacts/mockup-sandbox/android/gradlew

      - name: Build debug APK
        run: |
          cd artifacts/mockup-sandbox/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YVL-Music-debug
          path: artifacts/mockup-sandbox/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Upload Release-ready APK info
        run: |
          echo "✅ APK built successfully!"
          echo "📦 Download from the Actions tab → YVL-Music-debug artifact"
          ls -lh artifacts/mockup-sandbox/android/app/build/outputs/apk/debug/ || true

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm --filter @workspace/mockup-sandbox run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: YVL-Music-web
          path: artifacts/mockup-sandbox/dist/
          retention-days: 30
